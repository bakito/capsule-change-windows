minimum_prek_version = "0.5.5"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
exclude = '^(\.devbox/|\.task/|bin/|dist/|artifacts/|builds/)'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "generated"
name = "Generate API code and manifests"
entry = "devbox run -- task generate manifests"
language = "system"
files = '^(api/|internal/|go\.(mod|sum)$|hack/boilerplate.go.txt$)'
pass_filenames = false
require_serial = true
priority = 0

[[repos.hooks]]
id = "golangci-lint"
name = "Lint Go sources"
entry = "devbox run -- task lint"
language = "system"
types = ["go"]
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "go-test"
name = "Run Go unit tests"
entry = "devbox run -- task test:unit"
language = "system"
types = ["go"]
pass_filenames = false
priority = 30

[[repos.hooks]]
id = "yamlfmt"
name = "Check YAML formatting"
entry = "devbox run -- task lint:yaml:format --"
language = "system"
types = ["yaml"]
exclude = '^charts/[^/]+/(templates|crds|files)/'
priority = 10

[[repos.hooks]]
id = "actionlint"
name = "Validate GitHub Actions"
entry = "devbox run -- task lint:actions"
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "shellcheck"
name = "Check inline Task shell commands"
entry = "devbox run -- task lint:shell"
language = "system"
files = '^(Taskfile\.yml|hack/tooling/.*\.go)$'
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "docs"
name = "Validate documentation and generated API reference"
entry = "devbox run -- task docs:check"
language = "system"
files = '^(docs/|api/|examples/|hack/docs/|Taskfile\.yml$|hack/tools/)'
pass_filenames = false
priority = 40

[[repos.hooks]]
id = "conventional-commit"
name = "Check Conventional Commit message"
entry = "devbox run -- task lint:commit-message --"
language = "system"
stages = ["commit-msg"]
priority = 10

[[repos.hooks]]
id = "files"
name = "Check file hygiene and syntax"
entry = "devbox run -- task lint:files --"
language = "system"
priority = 10
