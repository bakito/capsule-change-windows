apiVersion: addons.projectcapsule.dev/v1alpha1
kind: ChangeWindow
metadata:
  name: tenant-maintenance
spec:
  serviceAccount:
    namespace: schedule-action-controller-system
    name: tenant-maintenance
  namespaceSelectors:
    - matchLabels:
        maintenance: enabled
  schedules:
    - name: sunday
      cron: "0 2 * * 0"
      timeZone: Europe/Zurich
      duration: 2h
  targets:
    - name: all-resources
      apiVersion: "*"
      kind: "*"
  admission:
    - name: freeze-except-pods
      targets: [all-resources]
      operations: [CREATE, UPDATE, DELETE]
      subresources: ["", "*"]
      audience:
        include:
          - kind: Group
            name: tenant-developers
      matchConditions:
        - name: not-a-pod
          expression: "!(request.resource.group == '' && request.resource.resource == 'pods')"
      when: Active
      action: Deny
      message: "Tenant maintenance is active. Only Pod changes are allowed for your group."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-maintenance
  namespace: schedule-action-controller-system
automountServiceAccountToken: false
