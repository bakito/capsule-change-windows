{{- if and .Values.crds.install (not $.Values.crds.inline) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "change-windows.crds.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-4"
    {{- include "change-windows.crds.annotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "change-windows.crds.component" . | quote }}
    app.kubernetes.io/name: {{ include "change-windows.crds.component" . | quote }}
    {{- include "change-windows.labels" . | nindent 4 }}
{{- end }}
