{{- if not .Values.crds.exclusive }}
  {{- if .Values.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "change-windows.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "change-windows.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
    {{- range . }}
  - name: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
