version: 2
project_name: change-windows
before:
  hooks:
    - 'task headlamp:release-build VERSION={{ .Version }}'
builds:
  - id: controller
    main: ./cmd
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
archives:
  - id: controller
    ids:
      - controller
    name_template: >-
      {{ .ProjectName }}_ {{- .Version }}_ {{- .Os }}_ {{- .Arch }}
  - id: headlamp
    meta: true
    name_template: 'change-windows-{{ .Version }}'
    wrap_in_directory: headlamp
    files:
      - src: headlamp/dist/main.js
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: headlamp/dist/package.json
        strip_parent: true
        info:
          mtime: '{{ .CommitDate }}'
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
release:
  prerelease: auto
  footer: |
    **Full Changelog**: https://github.com/projectcapsule/schedule-action-controller/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Container images (ko)**
    - `ghcr.io/projectcapsule/change-windows:{{ .Version }}`

    **Helm Chart**
    View this release on [Artifact Hub](https://artifacthub.io/packages/helm/projectcapsule/change-windows/{{ .Version }}) or use the OCI helm chart:

    - `ghcr.io/projectcapsule/charts/{{ .ProjectName }}:{{ .Version }}`

    Thanks to all the contributors! 🚀 🦄
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore'
      - '^rebase:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    # https://github.com/conventional-changelog/commitlint/tree/master/%40commitlint/config-conventional
    - title: '🛠 Dependency updates'
      regexp: '^fix\(deps\):|^feat\(deps\):'
      order: 300
    - title: '✨ New Features'
      regexp: '^feat(\([^)]*\))?:'
      order: 100
    - title: '🐛 Bug fixes'
      regexp: '^fix(\([^)]*\))?:'
      order: 200
    - title: '📖 Documentation updates'
      regexp: '^docs(\([^)]*\))?:'
      order: 400
    - title: '🛡️ Security updates'
      regexp: '^sec(\([^)]*\))?:'
      order: 500
    - title: '🚀 Build process updates'
      regexp: '^(build|ci)(\([^)]*\))?:'
      order: 600
    - title: '📦 Other work'
      regexp: '^chore(\([^)]*\))?:|^chore:'
      order: 9999
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
