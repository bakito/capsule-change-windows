version: '3'

silent: true

set: [errexit, nounset, pipefail]

vars:
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  VERSION: '{{.VERSION | default .GIT_VERSION}}'
  REGISTRY: '{{.REGISTRY | default "ghcr.io"}}'
  REPOSITORY: '{{.REPOSITORY | default "projectcapsule/change-windows"}}'
  IMG: '{{.IMG | default (printf "%s/%s:%s" .REGISTRY .REPOSITORY .VERSION)}}'
  IMAGE_PLATFORM: '{{.IMAGE_PLATFORM | default ""}}'
  PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
  IMAGE_ARCHIVE: '{{.IMAGE_ARCHIVE | default "dist/controller.tar"}}'
  IMAGE_REFS: '{{.IMAGE_REFS | default "dist/image-refs.txt"}}'
  BUILD_DIR: '{{.BUILD_DIR | default "bin"}}'
  ARTIFACTS: '{{.ARTIFACTS | default "artifacts"}}'
  KIND_CLUSTER: '{{.KIND_CLUSTER | default "scheduled-action-e2e"}}'
  KIND_NODE_IMAGE: '{{.KIND_NODE_IMAGE | default "kindest/node:v1.36.1"}}'
  ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION | default "1.36.0"}}'
  ENVTEST_ASSETS_DIR: '{{.ENVTEST_ASSETS_DIR | default "bin/envtest"}}'
  GO_TEST_FLAGS: '{{.GO_TEST_FLAGS | default "-race"}}'
  ENTERPRISE_VERSION: '{{.ENTERPRISE_VERSION | default ""}}'
  ENTERPRISE_REGISTRY: '{{.ENTERPRISE_REGISTRY | default "registry.projectcapsule.dev"}}'
  DRY_RUN: '{{.DRY_RUN | default "false"}}'
  DOCS_BASE_URL: '{{.DOCS_BASE_URL | default "https://projectcapsule.github.io/schedule-action-controller/"}}'

  LAPTOP_HOST_IP: '{{.LAPTOP_HOST_IP | default ""}}'
  DEV_HOST: '{{.DEV_HOST | default .LAPTOP_HOST_IP | default ""}}'
  DEV_CONTEXT: '{{.DEV_CONTEXT | default ""}}'
  DEV_NAMESPACE: '{{.DEV_NAMESPACE | default "change-windows-system"}}'
  DEV_RELEASE: '{{.DEV_RELEASE | default "change-windows"}}'
  DEV_CERT_DIR: '{{.DEV_CERT_DIR | default "bin/dev/serving-certs"}}'
  DEV_IMAGE_MODE: '{{.DEV_IMAGE_MODE | default "kind"}}'
  DEV_KIND_CLUSTER: '{{.DEV_KIND_CLUSTER | default ""}}'
  DEV_HELM_VALUES: '{{.DEV_HELM_VALUES | default ""}}'
  DEV_TIMEOUT: '{{.DEV_TIMEOUT | default "180"}}'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  generate:
    desc: Generate DeepCopy methods.
    run: once
    preconditions:
      - sh: command -v controller-gen
        msg: Missing controller-gen. Run devbox run -- task or enter devbox shell; see DEVELOPMENT.md.
    cmds:
      - controller-gen object:headerFile=hack/boilerplate.go.txt paths=./...

  manifests:
    desc: Generate CRDs and RBAC directly into the Helm chart.
    run: once
    preconditions:
      - sh: command -v controller-gen
        msg: Missing controller-gen. Run devbox run -- task or enter devbox shell; see DEVELOPMENT.md.
    cmds:
      - controller-gen rbac:roleName=manager-role,fileName=manager-role.yaml crd paths=./... output:crd:dir=charts/change-windows/crds output:rbac:dir=charts/change-windows/files

  fmt:
    desc: Format Go sources and maintained YAML files.
    cmds:
      - golangci-lint fmt
      - yamlfmt .

  vet:
    desc: Run go vet.
    cmds:
      - go vet ./...

  test:
    desc: Run unit and real API-server tests with the race detector.
    env:
      ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION}}'
      ENVTEST_ASSETS_DIR: '{{.ENVTEST_ASSETS_DIR}}'
      GO_TEST_FLAGS: '{{.GO_TEST_FLAGS}}'
    cmds:
      - task: generate
      - task: manifests
      - |
        if [ -z "${KUBEBUILDER_ASSETS:-}" ]; then
          KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$ENVTEST_ASSETS_DIR" -p path)"
        fi
        KUBEBUILDER_ASSETS="$(cd "$KUBEBUILDER_ASSETS" && pwd)"
        export KUBEBUILDER_ASSETS
        read -r -a flags <<< "$GO_TEST_FLAGS"
        go test "${flags[@]}" ./... -coverprofile=coverage.out

  test:unit:
    desc: Run unit tests without starting an API server.
    aliases: [test-unit]
    env:
      GO_TEST_FLAGS: '{{.GO_TEST_FLAGS}}'
    cmds:
      - task: generate
      - |
        read -r -a flags <<< "$GO_TEST_FLAGS"
        go test "${flags[@]}" ./... -skip '^TestAPI$'

  test:tooling:
    desc: Test Task, hook, rendering, and release command behavior without publishing.
    cmds:
      - go test -tags=tooling ./hack/tooling -v

  docs:generate:
    desc: Generate the API reference from Go types.
    cmds:
      - |
        root="$PWD"
        scratch="$(mktemp -d)"
        trap 'rm -rf "$scratch"' EXIT
        reference="${REFERENCE_PATH:-$root/docs/content/docs/reference/api.md}"

        # Keep the generator's dependencies out of the controller module. Go caches the
        # pinned tool; no downloaded executable or Python environment is maintained here.
        go -C "$root/hack/tools" tool crd-ref-docs \
          --source-path="$root/api" \
          --config="$root/docs/api-reference.yaml" \
          --renderer=markdown --output-path="$scratch/reference.md"
        {
          cat <<'FRONTMATTER'
        ---
        title: API reference
        weight: 10
        description: Generated reference for the ChangeWindow Kubernetes API.
        ---

        <!-- Generated by task docs:generate from api/v1alpha1. Do not edit. -->

        FRONTMATTER
          # Make API types directly navigable in the page table of contents.
          sed '/^# API Reference$/d; s/^#### /## /; s/[[:blank:]]*$//' "$scratch/reference.md" |
            awk 'NF { if (blank && seen) print ""; print; blank=0; seen=1; next } { blank=1 }'
        } > "$scratch/page.md"
        cp "$scratch/page.md" "$reference"

  docs:install:
    desc: Install locked Doks theme and asset dependencies.
    dir: docs
    run: once
    cmds:
      - npm ci --ignore-scripts --no-audit --no-fund

  docs:toolchain:
    desc: Check the required Hugo Extended version.
    run: once
    cmds:
      - |
        # Keep this aligned with docs/hugo.toml and the Devbox pin (checked by tooling tests).
        minimum=0.166.0
        version=''
        compatible=false
        if version="$(hugo version 2>/dev/null)" &&
          [[ "$version" =~ ^hugo\ v([0-9]+)\.([0-9]+)\.([0-9]+)([^[:space:]]*) ]]; then
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          edition="${BASH_REMATCH[4]}"
          IFS=. read -r min_major min_minor min_patch <<< "$minimum"
          if [[ "$edition" =~ (^|\+)extended(\+|$) ]] &&
            (( major > min_major ||
               (major == min_major && minor > min_minor) ||
               (major == min_major && minor == min_minor && patch >= min_patch) )); then
            compatible=true
          fi
        fi

        if [[ "$compatible" != true ]]; then
          printf 'Documentation requires Hugo Extended >= %s.\n' "$minimum" >&2
          printf 'Found: %s\n' "${version:-hugo is missing or could not run}" >&2
          printf '%s\n' \
            'Run from the repository root: devbox run -- task docs:serve' \
            'Or put a compatible Hugo Extended installation on PATH.' \
            'Older Hugo versions cannot load the theme and layouts/_shortcodes templates.' >&2
          exit 1
        fi

  docs:build:
    desc: Build the Hugo documentation into dist/docs.
    env:
      DOCS_BASE_URL: '{{.DOCS_BASE_URL}}'
    cmds:
      - task: docs:toolchain
      - task: docs:install
      - task: docs:generate
      - npm --prefix docs run build -- --baseURL "$DOCS_BASE_URL"

  docs:serve:
    desc: Preview documentation at http://localhost:1313 with live reload.
    cmds:
      - task: docs:toolchain
      - task: docs:install
      - task: docs:generate
      - npm --prefix docs run dev -- --baseURL http://localhost:1313/

  docs:check:
    desc: Check API-reference drift, example validity, and rendered links/assets.
    cmds:
      - task: docs:toolchain
      - task: docs:install
      - |
        reference=$(mktemp)
        trap 'rm -f "$reference"' EXIT
        REFERENCE_PATH="$reference" task docs:generate
        diff -u docs/content/docs/reference/api.md "$reference" || {
          echo 'API reference is stale. Run task docs:generate.' >&2
          exit 1
        }
      - go test -tags=docs ./hack/docs -v -count=1

  docs:test:browser:
    desc: Test the homepage YAML explorer on desktop and mobile Chromium.
    cmds:
      - task: docs:toolchain
      - task: docs:install
      - npm --prefix docs run test:browser

  docs:browser:install:
    desc: Install Chromium and its Linux runtime dependencies for documentation tests.
    cmds:
      - task: docs:install
      - npm --prefix docs exec -- playwright install --with-deps chromium

  headlamp:install:
    desc: Install the plugin's locked npm dependencies.
    dir: headlamp
    cmds:
      - npm ci --include=dev --no-audit --no-fund

  headlamp:check:
    desc: Lint, format-check, type-check, test and build the Headlamp plugin.
    dir: headlamp
    cmds:
      - npm run check

  headlamp:build:
    desc: Build the plugin into headlamp/dist.
    dir: headlamp
    cmds:
      - npm run build

  headlamp:serve:
    desc: Start the Headlamp SDK plugin development watcher.
    dir: headlamp
    cmds:
      - npm start

  headlamp:test:browser:
    desc: Test the built plugin in an existing Headlamp frontend using intercepted API fixtures.
    dir: headlamp
    cmds:
      - npm run build
      - npm run test:browser

  headlamp:package:
    desc: Package the plugin locally without publishing.
    dir: headlamp
    cmds:
      - npm run build
      - npm run package

  lint:
    desc: Lint Go sources.
    aliases: [golint]
    cmds:
      - golangci-lint run --timeout=5m

  lint:fix:
    desc: Apply Go lint and formatting fixes.
    aliases: [lint-fix, golint-fix]
    cmds:
      - golangci-lint fmt
      - golangci-lint run --fix --timeout=5m

  lint:config:
    desc: Validate the Go linter configuration.
    aliases: [lint-config]
    cmds:
      - golangci-lint config verify

  lint:yaml:
    desc: Validate YAML syntax and formatting without Python.
    aliases: [lint-yaml]
    cmds:
      - prek run --config hack/prek-builtins.toml check-yaml --all-files
      - task: lint:yaml:format

  lint:actions:
    desc: Validate GitHub Actions and inline shell scripts.
    aliases: [lint-actions]
    cmds:
      - actionlint -pyflakes=''

  lint:shell:
    desc: ShellCheck the inline Task commands.
    cmds:
      - go test -tags=tooling ./hack/tooling -run '^TestTaskShell$' -count=1

  lint:files:
    desc: Run native prek file hygiene and syntax checks.
    cmds:
      - prek run --config hack/prek-builtins.toml {{if .CLI_ARGS}}--files {{.CLI_ARGS}}{{else}}--all-files{{end}}

  lint:commits:
    desc: Validate Conventional Commits between COMMIT_BASE and COMMIT_HEAD.
    cmds:
      - |
        : "${COMMIT_HEAD:=HEAD}"
        if [[ -z "${COMMIT_BASE:-}" || "$COMMIT_BASE" =~ ^0+$ ]]; then
          commits=$(git rev-list -1 "$COMMIT_HEAD" --)
        else
          commits=$(git rev-list "$COMMIT_BASE..$COMMIT_HEAD" --)
        fi
        while IFS= read -r commit; do
          [[ -n "$commit" ]] || continue
          git show -s --format=%B "$commit" -- | cog verify --ignore-merge-commits --file -
        done <<< "$commits"

  test:benchmarks:
    desc: Check benchmark fixtures with the race detector.
    cmds:
      - go test -race ./internal/... -run '^$' -bench . -benchtime=1x

  hooks:install:
    desc: Install prek's pre-commit and commit-msg hooks.
    cmds:
      - prek install --force --hook-type pre-commit --hook-type commit-msg

  hooks:check:
    desc: Run all pre-commit hooks on tracked files.
    cmds:
      - prek run --all-files

  verify-generated:
    desc: Reject stale or untracked generated artifacts.
    cmds:
      - task: generate
      - task: manifests
      - git diff --exit-code -- api charts/change-windows/crds charts/change-windows/files
      - |
        if [ -n "$(git ls-files --others --exclude-standard api charts/change-windows/crds charts/change-windows/files)" ]; then
          echo 'Untracked generated files found in api/ or Helm chart assets' >&2
          exit 1
        fi

  build:
    desc: Build the controller binary.
    aliases: [all]
    env:
      BUILD_DIR: '{{.BUILD_DIR}}'
    cmds:
      - task: generate
      - task: manifests
      - task: vet
      - mkdir -p "$BUILD_DIR"
      - go build -trimpath -o "$BUILD_DIR/manager" ./cmd

  run:
    desc: Run the controller against the current kubeconfig context.
    cmds:
      - task: generate
      - task: manifests
      - go run ./cmd

  dev:setup:
    desc: Install CRDs and admission webhooks pointing to DEV_HOST on port 9443.
    aliases: [dev-setup]
    env: &dev-env
      DEV_HOST: '{{.DEV_HOST}}'
      DEV_CONTEXT: '{{.DEV_CONTEXT}}'
      DEV_NAMESPACE: '{{.DEV_NAMESPACE}}'
      DEV_RELEASE: '{{.DEV_RELEASE}}'
      DEV_CERT_DIR: '{{.DEV_CERT_DIR}}'
    cmds:
      - task: generate
      - task: manifests
      - |
        bash -euo pipefail <<'BASH'
        umask 077

        : "${DEV_CONTEXT:?DEV_CONTEXT must name the development kubeconfig context}"
        : "${DEV_NAMESPACE:?DEV_NAMESPACE is required}"
        : "${DEV_RELEASE:?DEV_RELEASE is required}"
        : "${DEV_CERT_DIR:?DEV_CERT_DIR is required}"

        # Validate before generating credentials or changing cluster resources.
        kubectl --context "$DEV_CONTEXT" cluster-info >/dev/null
        mkdir -p "$DEV_CERT_DIR"
        chmod 700 "$DEV_CERT_DIR"
        DEV_CERT_DIR=$(cd "$DEV_CERT_DIR" && pwd)
        cert="$DEV_CERT_DIR/tls.crt"
        key="$DEV_CERT_DIR/tls.key"

        : "${DEV_HOST:?Set DEV_HOST or LAPTOP_HOST_IP to a host reachable from the API server}"
        if [[ "$DEV_HOST" == *:* && "$DEV_HOST" =~ ^[0-9a-fA-F:]+$ ]]; then
          san="IP:$DEV_HOST"
          check=(-checkip "$DEV_HOST")
          url="https://[$DEV_HOST]:9443"
        elif [[ "$DEV_HOST" =~ ^[0-9.]+$ ]]; then
          san="IP:$DEV_HOST"
          check=(-checkip "$DEV_HOST")
          url="https://$DEV_HOST:9443"
        elif [[ "$DEV_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$ ]]; then
          san="DNS:$DEV_HOST"
          check=(-checkhost "$DEV_HOST")
          url="https://$DEV_HOST:9443"
        else
          echo 'DEV_HOST must be an IP address or DNS name, without a scheme, port, or path.' >&2
          exit 1
        fi
        case "$DEV_HOST" in
          localhost|127.*|::1|0.0.0.0|::) echo 'DEV_HOST must be reachable from the cluster, not a loopback or unspecified address.' >&2; exit 1 ;;
        esac

        # Keep the trust bundle stable across repeat setup; renew expiring or mismatched certs.
        if [[ ! -s "$cert" || ! -s "$key" ]] || \
          ! openssl x509 -in "$cert" -checkend 86400 -noout >/dev/null 2>&1 || \
          ! openssl x509 -in "$cert" "${check[@]}" -noout >/dev/null 2>&1; then
          temp=$(mktemp -d "$DEV_CERT_DIR/new.XXXXXX")
          trap 'rm -rf "$temp"' EXIT
          openssl req -x509 -newkey rsa:3072 -noenc -days 30 \
            -subj '/O=Project Capsule/CN=Change Windows development' \
            -addext "subjectAltName=$san" \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign' \
            -addext 'extendedKeyUsage=serverAuth' \
            -keyout "$temp/tls.key" -out "$temp/tls.crt" 2>"$temp/openssl.log" || {
              cat "$temp/openssl.log" >&2
              exit 1
            }
          mv "$temp/tls.key" "$key"
          mv "$temp/tls.crt" "$cert"
          rm -rf "$temp"
          trap - EXIT
        fi
        chmod 600 "$key"
        ca_bundle=$(openssl base64 -A -in "$cert")

        # Inline CRDs avoid a hook job and make Helm the sole installer for development.
        # Keep CRDs on uninstall, while removing the fail-closed webhook configuration.
        helm --kube-context "$DEV_CONTEXT" upgrade --install "$DEV_RELEASE" charts/change-windows \
          --namespace "$DEV_NAMESPACE" --create-namespace --skip-crds --wait --timeout 2m \
          --set crds.install=true --set crds.inline=true --set crds.keep=true --set crds.exclusive=true \
          --set webhooks.enabled=true --set webhooks.exclusive=true \
          --set webhooks.certificate.generate.enabled=false \
          --set-string "webhooks.service.url=$url" \
          --set-string "webhooks.service.caBundle=$ca_bundle"
        kubectl --context "$DEV_CONTEXT" wait --for=condition=Established \
          crd/changewindows.addons.projectcapsule.dev --timeout=60s
        printf 'Admission points to %s. Start the host controller with task dev:run using the same DEV_CONTEXT and DEV_NAMESPACE.\n' "$url"
        BASH

  dev:run:
    desc: Run the host controller using the dev:setup certificates and kubeconfig context.
    aliases: [dev-run]
    env: *dev-env
    cmds:
      - |
        bash -euo pipefail <<'BASH'
        umask 077

        : "${DEV_CONTEXT:?DEV_CONTEXT must name the development kubeconfig context}"
        : "${DEV_NAMESPACE:?DEV_NAMESPACE is required}"
        : "${DEV_RELEASE:?DEV_RELEASE is required}"
        : "${DEV_CERT_DIR:?DEV_CERT_DIR is required}"

        # Validate before generating credentials or changing cluster resources.
        kubectl --context "$DEV_CONTEXT" cluster-info >/dev/null
        mkdir -p "$DEV_CERT_DIR"
        chmod 700 "$DEV_CERT_DIR"
        DEV_CERT_DIR=$(cd "$DEV_CERT_DIR" && pwd)
        cert="$DEV_CERT_DIR/tls.crt"
        key="$DEV_CERT_DIR/tls.key"

        [[ -s "$cert" && -s "$key" ]] || { echo 'Run task dev:setup first to create the serving certificates.' >&2; exit 1; }
        # Snapshot only the explicitly selected context, without mutating the user's config.
        run_dir=$(mktemp -d "$DEV_CERT_DIR/run.XXXXXX")
        controller_pid=''
        cleanup_run() {
          if [[ -n "$controller_pid" ]]; then
            kill -TERM "$controller_pid" 2>/dev/null || true
            wait "$controller_pid" || true
          fi
          rm -rf "$run_dir"
        }
        trap 'cleanup_run' EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        kubectl --context "$DEV_CONTEXT" config view --minify --flatten --raw > "$run_dir/kubeconfig"
        # go run does not reliably forward termination to its compiled child.
        go build -o "$run_dir/manager" ./cmd
        KUBECONFIG="$run_dir/kubeconfig" "$run_dir/manager" \
          --system-namespace="$DEV_NAMESPACE" \
          --webhook-cert-path="$DEV_CERT_DIR" \
          --metrics-bind-address=0 \
          --health-probe-bind-address=127.0.0.1:8081 &
        controller_pid=$!
        wait "$controller_pid"
        BASH

  dev:deploy:
    desc: Build current source with ko and deploy with Helm to an explicit development context.
    aliases: [dev-deploy]
    env:
      DEV_CONTEXT: '{{.DEV_CONTEXT}}'
      DEV_NAMESPACE: '{{.DEV_NAMESPACE}}'
      DEV_RELEASE: '{{.DEV_RELEASE}}'
      DEV_IMAGE_MODE: '{{.DEV_IMAGE_MODE}}'
      DEV_KIND_CLUSTER: '{{.DEV_KIND_CLUSTER}}'
      DEV_HELM_VALUES: '{{.DEV_HELM_VALUES}}'
      DEV_TIMEOUT: '{{.DEV_TIMEOUT}}'
      IMG: '{{.IMG}}'
      IMAGE_PLATFORM: '{{.IMAGE_PLATFORM}}'
      PLATFORMS: '{{.PLATFORMS}}'
      IMAGE_ARCHIVE: '{{.IMAGE_ARCHIVE}}'
      IMAGE_REFS: '{{.IMAGE_REFS}}'
    preconditions:
      - sh: for tool in go controller-gen ko helm kubectl openssl{{if eq .DEV_IMAGE_MODE "kind"}} kind{{end}}; do command -v "$tool" >/dev/null || exit 1; done
        msg: Missing development tools. Run devbox run -- task or enter devbox shell; see DEVELOPMENT.md.
    cmds:
      - task: generate
      - task: manifests
      - |
        bash -euo pipefail <<'BASH'
        umask 077

        : "${DEV_CONTEXT:?DEV_CONTEXT must name the development kubeconfig context}"
        : "${DEV_NAMESPACE:?DEV_NAMESPACE is required}"
        : "${DEV_RELEASE:?DEV_RELEASE is required}"
        : "${IMG:?IMG must be a tagged image reference}"
        : "${DEV_IMAGE_MODE:=kind}"
        : "${DEV_TIMEOUT:=180}"
        case "$DEV_IMAGE_MODE" in
          kind) : "${DEV_KIND_CLUSTER:?DEV_KIND_CLUSTER must name an existing Kind cluster}" ;;
          registry) ;;
          *) echo 'DEV_IMAGE_MODE must be kind or registry' >&2; exit 1 ;;
        esac
        [[ "$DEV_TIMEOUT" =~ ^[1-9][0-9]*$ ]] || { echo 'DEV_TIMEOUT must be a positive number of seconds' >&2; exit 1; }
        values=(--reset-values)
        if [[ -n "${DEV_HELM_VALUES:-}" ]]; then
          [[ -f "$DEV_HELM_VALUES" ]] || { echo "Helm values file not found: $DEV_HELM_VALUES" >&2; exit 1; }
          values+=(-f "$DEV_HELM_VALUES")
        fi
        kube=(kubectl --context "$DEV_CONTEXT")
        "${kube[@]}" cluster-info >/dev/null
        "${kube[@]}" get crd certificates.cert-manager.io issuers.cert-manager.io >/dev/null || {
          echo 'Install cert-manager before running dev:deploy.' >&2
          exit 1
        }

        temp=$(mktemp -d)
        cleanup() {
          result=$?
          rm -rf "$temp"
          exit "$result"
        }
        trap cleanup EXIT
        pull_policy=IfNotPresent
        if [[ "$DEV_IMAGE_MODE" == kind ]]; then
          # Verify the selected context actually connects to the cluster receiving the image.
          kind get kubeconfig --name "$DEV_KIND_CLUSTER" > "$temp/kubeconfig"
          cluster_path='{.clusters[0].cluster.server}{"\n"}{.clusters[0].cluster.certificate-authority-data}'
          expected=$(kubectl --kubeconfig "$temp/kubeconfig" config view --minify --flatten --raw -o "jsonpath=$cluster_path")
          actual=$("${kube[@]}" config view --minify --flatten --raw -o "jsonpath=$cluster_path")
          [[ -n "$expected" && "$actual" == "$expected" ]] || { echo 'DEV_CONTEXT does not point to DEV_KIND_CLUSTER' >&2; exit 1; }
          arch=$("${kube[@]}" get nodes -o 'jsonpath={range .items[*]}{.status.nodeInfo.architecture}{"\n"}{end}' | sort -u)
          case "$arch" in amd64|arm64) ;; *) echo 'Kind deployment requires a single amd64 or arm64 architecture' >&2; exit 1 ;; esac
          if [[ -n "${IMAGE_PLATFORM:-}" && "$IMAGE_PLATFORM" != "linux/$arch" ]]; then
            echo "IMAGE_PLATFORM must match the Kind nodes: linux/$arch" >&2
            exit 1
          fi
          export IMAGE_PLATFORM="linux/$arch"
          # Repeated deployments of an uncommitted working tree must replace running Pods.
          IMG="$IMG-$(date -u +%Y%m%d%H%M%S)-$(openssl rand -hex 4)"
          export IMG
          task image:build
          kind load image-archive "$IMAGE_ARCHIVE" --name "$DEV_KIND_CLUSTER"
          image="$IMG"
          pull_policy=Never
          # Kind runs inside containers which may not support nested user namespaces.
          values+=(--set manager.hostUsers=true)
        else
          task image:push
          image=$(cat "$IMAGE_REFS")
          if [[ ! "$image" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ || "${image%@*}" != "${IMG%:*}" ]]; then
            echo 'ko did not produce the expected immutable image reference' >&2
            exit 1
          fi
        fi

        # Inline CRDs avoid a separate hook image and support upgrades from dev:setup.
        # Explicitly replace host webhook settings when switching to in-cluster execution.
        helm --kube-context "$DEV_CONTEXT" upgrade --install "$DEV_RELEASE" charts/change-windows \
          --namespace "$DEV_NAMESPACE" --create-namespace --skip-crds \
          --wait --timeout "${DEV_TIMEOUT}s" "${values[@]}" \
          --set crds.install=true --set crds.inline=true --set crds.keep=true --set crds.exclusive=false \
          --set webhooks.enabled=true --set webhooks.exclusive=false \
          --set-string webhooks.service.url= --set-string webhooks.service.caBundle= \
          --set webhooks.certificate.generate.enabled=true \
          --set-string "manager.image.reference=$image" \
          --set-string "manager.image.pullPolicy=$pull_policy"
        selector="app.kubernetes.io/instance=$DEV_RELEASE"
        "${kube[@]}" -n "$DEV_NAMESPACE" rollout status deployment --selector "$selector" --timeout="${DEV_TIMEOUT}s"
        "${kube[@]}" -n "$DEV_NAMESPACE" wait certificate --selector "$selector" --for=condition=Ready --timeout="${DEV_TIMEOUT}s"
        for index in 0 1; do
          "${kube[@]}" wait validatingwebhookconfiguration --selector "$selector" \
            --for="jsonpath={.webhooks[$index].clientConfig.caBundle}" --timeout="${DEV_TIMEOUT}s"
        done
        # Probe through the API server to check TLS and admission registration, with no persisted object.
        cat > "$temp/probe.yaml" <<'YAML'
        apiVersion: addons.projectcapsule.dev/v1alpha1
        kind: ChangeWindow
        metadata:
          generateName: dev-readiness-
        spec:
          namespaceSelectors:
            - matchLabels:
                change-windows.dev/readiness: probe
          schedules:
            - name: probe
              cron: '0 0 * * *'
              duration: 1m
          targets:
            - name: configs
              apiVersion: v1
              kind: ConfigMap
          admission:
            - name: probe
              targets: [configs]
              operations: [UPDATE]
              when: Active
              action: Deny
              message: Readiness probe
        YAML
        deadline=$((SECONDS + DEV_TIMEOUT))
        until "${kube[@]}" create --dry-run=server -f "$temp/probe.yaml" > "$temp/probe.log" 2>&1; do
          if (( SECONDS >= deadline )); then cat "$temp/probe.log" >&2; exit 1; fi
          sleep 1
        done
        printf 'Deployed %s to %s (%s/%s); controller and admission are ready.\n' "$image" "$DEV_CONTEXT" "$DEV_NAMESPACE" "$DEV_RELEASE"
        BASH

  image:build:
    desc: Build a Linux image archive with ko, without a container daemon or registry push.
    aliases: ['image:ko', ko-build-controller, ko-build-all]
    env:
      IMG: '{{.IMG}}'
      IMAGE_PLATFORM: '{{.IMAGE_PLATFORM}}'
      IMAGE_ARCHIVE: '{{.IMAGE_ARCHIVE}}'
      IMAGE_REFS: '{{.IMAGE_REFS}}'
    cmds:
      - task: generate
      - |
        : "${IMG:?IMG must be a tagged image reference}"
        : "${IMAGE_REFS:=dist/image-refs.txt}"
        # Split the tag from the last path component, retaining registry ports.
        if [[ "$IMG" == *@* || "${IMG##*/}" != *:* || "$IMG" == *[[:space:]]* ]]; then
          echo 'IMG must include a tag and must not contain a digest or whitespace' >&2
          exit 1
        fi
        image_repo=${IMG%:*}
        image_tag=${IMG##*:}
        if [[ ! "$image_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || ! "$image_repo" =~ ^[a-z0-9][a-z0-9./:_-]*$ ]]; then
          echo 'IMG contains an invalid repository or tag' >&2
          exit 1
        fi
        export KO_DOCKER_REPO="$image_repo"
        export CGO_ENABLED=0
        mkdir -p "$(dirname "$IMAGE_REFS")"
        # Never leave a previous successful reference available after a failed build.
        rm -f "$IMAGE_REFS"
        args=(build ./cmd --bare "--tags=$image_tag" "--image-refs=$IMAGE_REFS")
        : "${IMAGE_PLATFORM:=linux/$(go env GOHOSTARCH)}"
        if [[ "$IMAGE_PLATFORM" != linux/* || "$IMAGE_PLATFORM" == *,* ]]; then
          echo 'IMAGE_PLATFORM must select one Linux architecture for the local archive' >&2
          exit 1
        fi
        mkdir -p "$(dirname "$IMAGE_ARCHIVE")"
        rm -f "$IMAGE_ARCHIVE"
        ko "${args[@]}" --push=false "--platform=$IMAGE_PLATFORM" "--tarball=$IMAGE_ARCHIVE" --tag-only

  image:push:
    desc: Build and publish multi-platform images with ko (explicit invocation only).
    aliases: [ko-publish-controller]
    env:
      IMG: '{{.IMG}}'
      PLATFORMS: '{{.PLATFORMS}}'
      IMAGE_REFS: '{{.IMAGE_REFS}}'
    cmds:
      - task: generate
      - |
        : "${IMG:?IMG must be a tagged image reference}"
        : "${IMAGE_REFS:=dist/image-refs.txt}"
        # Split the tag from the last path component, retaining registry ports.
        if [[ "$IMG" == *@* || "${IMG##*/}" != *:* || "$IMG" == *[[:space:]]* ]]; then
          echo 'IMG must include a tag and must not contain a digest or whitespace' >&2
          exit 1
        fi
        image_repo=${IMG%:*}
        image_tag=${IMG##*:}
        if [[ ! "$image_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || ! "$image_repo" =~ ^[a-z0-9][a-z0-9./:_-]*$ ]]; then
          echo 'IMG contains an invalid repository or tag' >&2
          exit 1
        fi
        export KO_DOCKER_REPO="$image_repo"
        export CGO_ENABLED=0
        mkdir -p "$(dirname "$IMAGE_REFS")"
        # Never leave a previous successful reference available after a failed build.
        rm -f "$IMAGE_REFS"
        args=(build ./cmd --bare "--tags=$image_tag" "--image-refs=$IMAGE_REFS")
        ko "${args[@]}" --push=true "--platform=$PLATFORMS"

  image:sign:
    desc: Sign the immutable image reference written by image:push.
    env:
      IMAGE_REFS: '{{.IMAGE_REFS}}'
    cmds:
      - |
        : "${IMAGE_REFS:=dist/image-refs.txt}"
        ref=$(cat "$IMAGE_REFS")
        if [[ ! "$ref" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
          echo 'Expected one immutable image reference; run task image:push first' >&2
          exit 1
        fi
        cosign sign --yes "$ref"

  registry:login:
    desc: Authenticate ko and Cosign with REGISTRY_USERNAME and REGISTRY_PASSWORD.
    env:
      REGISTRY: '{{.REGISTRY}}'
    cmds:
      - printf '%s' "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required}" | ko login "$REGISTRY" --username "${REGISTRY_USERNAME:?REGISTRY_USERNAME is required}" --password-stdin

  helm:login:
    desc: Authenticate Helm with REGISTRY_USERNAME and REGISTRY_PASSWORD.
    env:
      REGISTRY: '{{.REGISTRY}}'
    cmds:
      - printf '%s' "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required}" | helm registry login "$REGISTRY" --username "${REGISTRY_USERNAME:?REGISTRY_USERNAME is required}" --password-stdin

  e2e:
    desc: Build and deploy through dev:deploy in isolated Kind, then run e2e tests.
    aliases: [test-e2e]
    env:
      KIND: kind
      KUBECTL: kubectl
      KIND_CLUSTER: '{{.KIND_CLUSTER}}'
      KIND_NODE_IMAGE: '{{.KIND_NODE_IMAGE}}'
      IMG: '{{.IMG}}'
      ARTIFACTS: '{{.ARTIFACTS}}'
      IMAGE_ARCHIVE: '{{.IMAGE_ARCHIVE}}'
    cmds:
      - |
        bash -euo pipefail <<'BASH'
        : "${KIND:?KIND is required}"
        : "${KUBECTL:?KUBECTL is required}"
        : "${KIND_CLUSTER:?KIND_CLUSTER is required}"
        : "${KIND_NODE_IMAGE:?KIND_NODE_IMAGE is required}"
        : "${IMG:?IMG is required}"
        : "${IMAGE_ARCHIVE:?IMAGE_ARCHIVE is required}"
        : "${ARTIFACTS:?ARTIFACTS is required}"
        mkdir -p "$ARTIFACTS"
        : > "$ARTIFACTS/e2e.log"
        printf 'image=%s\nnode=%s\ncluster=%s\n' "$IMG" "$KIND_NODE_IMAGE" "$KIND_CLUSTER" > "$ARTIFACTS/run.txt"
        if "$KIND" get clusters | grep -Fxq "$KIND_CLUSTER"; then
          echo "Refusing to reuse or delete existing cluster $KIND_CLUSTER" >&2
          exit 1
        fi
        # A private kubeconfig prevents changing the developer's current context.
        export KUBECONFIG
        KUBECONFIG=$(mktemp)
        cluster_started=false
        cleanup() {
          result=$?
          if [[ "$cluster_started" == true ]]; then
            "$KIND" export logs --name "$KIND_CLUSTER" "$ARTIFACTS/cluster" > "$ARTIFACTS/export.log" 2>&1 || true
            "$KUBECTL" get events -A > "$ARTIFACTS/events.log" 2>&1 || true
            "$KUBECTL" get changewindows -o yaml > "$ARTIFACTS/changewindows.yaml" 2>&1 || true
            "$KUBECTL" logs -n schedule-action-controller-system deployment/change-windows > "$ARTIFACTS/controller.log" 2>&1 || true
            "$KIND" delete cluster --name "$KIND_CLUSTER" || result=1
          fi
          rm -f "$KUBECONFIG"
          exit "$result"
        }
        trap cleanup EXIT
        cluster_started=true
        "$KIND" create cluster --name "$KIND_CLUSTER" --image "$KIND_NODE_IMAGE" --kubeconfig "$KUBECONFIG" --wait 120s
        "$KUBECTL" apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
        "$KUBECTL" rollout status -n cert-manager deployment/cert-manager --timeout=120s
        "$KUBECTL" rollout status -n cert-manager deployment/cert-manager-webhook --timeout=120s
        "$KUBECTL" rollout status -n cert-manager deployment/cert-manager-cainjector --timeout=120s
        export DEV_CONTEXT="kind-$KIND_CLUSTER"
        export DEV_NAMESPACE=schedule-action-controller-system
        export DEV_RELEASE=change-windows
        export DEV_IMAGE_MODE=kind
        export DEV_KIND_CLUSTER="$KIND_CLUSTER"
        export DEV_HELM_VALUES=charts/change-windows/ci/admission-values.yaml
        task dev:deploy
        # A second deployment must also converge without leaving an old image running.
        previous_image=$("$KUBECTL" -n "$DEV_NAMESPACE" get deployment change-windows -o jsonpath='{.spec.template.spec.containers[0].image}')
        task dev:deploy
        current_image=$("$KUBECTL" -n "$DEV_NAMESPACE" get deployment change-windows -o jsonpath='{.spec.template.spec.containers[0].image}')
        [[ "$current_image" != "$previous_image" ]] || { echo 'Repeated dev deployment did not roll the image' >&2; exit 1; }
        printf 'first-image=%s\nsecond-image=%s\n' "$previous_image" "$current_image" >> "$ARTIFACTS/run.txt"
        # The e2e build tag keeps cluster-dependent tests out of ordinary go test runs.
        go test -tags=e2e ./e2e -v -count=1 -timeout=8m 2>&1 | tee "$ARTIFACTS/e2e.log"
        BASH

  helm:lint:
    desc: Validate Helm packaging.
    aliases: [helm-lint]
    cmds:
      - task: manifests
      - helm lint charts/change-windows --strict

  helm:docs:
    desc: Generate chart documentation from values and the chart README template.
    cmds:
      - helm-docs --chart-search-root charts/change-windows

  helm:artifacthub:
    desc: Lint chart metadata with the Artifact Hub CLI container.
    env:
      CHART_DIRECTORY: '{{.ROOT_DIR}}/charts'
    cmds:
      - docker run --rm --volume "${CHART_DIRECTORY}:/charts:ro" --workdir /charts --entrypoint ah artifacthub/ah lint

  helm:verify:
    desc: Check chart rendering and documentation drift.
    cmds:
      - task: helm:lint
      - task: helm:docs
      - git diff --exit-code -- charts/change-windows/README.md
      - test -z "$(git ls-files --others --exclude-standard charts/change-windows/README.md)"

  helm:package:
    desc: Package the chart using VERSION.
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - task: manifests
      - |
        : "${VERSION:?VERSION is required}"
        version=${VERSION#v}
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo 'VERSION must be SemVer without build metadata' >&2
          exit 1
        fi
        mkdir -p dist/charts
        helm package charts/change-windows --version "$version" --app-version "$version" --destination dist/charts

  helm:push:
    desc: Publish the chart to CHART_REGISTRY (explicit invocation only).
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - rm -f dist/chart-refs.txt
      - task: helm:package
      - |
        : "${VERSION:?VERSION is required}"
        : "${CHART_REGISTRY:=oci://ghcr.io/projectcapsule/charts}"
        version=${VERSION#v}
        helm push "dist/charts/change-windows-$version.tgz" "$CHART_REGISTRY" 2>&1 | tee dist/charts/push.log
        digest=$(sed -n 's/^Digest: \(sha256:[a-f0-9]*\)$/\1/p' dist/charts/push.log)
        if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo 'Helm did not return a valid digest' >&2
          exit 1
        fi
        printf '%s/change-windows@%s\n' "${CHART_REGISTRY#oci://}" "$digest" > dist/chart-refs.txt

  release:check:
    desc: Validate GoReleaser configuration.
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build release archives and SBOMs without publishing or signing.
    cmds:
      - task: release:check
      - goreleaser release --snapshot --clean --skip=publish,sign --timeout 90m

  release:
    desc: Publish a tagged GitHub release (explicit invocation only).
    cmds:
      - task: release:check
      - goreleaser release --clean --timeout 90m

  enterprise:release:
    desc: Publish the enterprise image and chart (use DRY_RUN=true to preview).
    aliases: [enterprise-release]
    env:
      ENTERPRISE_VERSION: '{{.ENTERPRISE_VERSION}}'
      ENTERPRISE_REGISTRY: '{{.ENTERPRISE_REGISTRY}}'
      DRY_RUN: '{{.DRY_RUN}}'
      CHANNEL: '{{.CHANNEL | default "enterprise"}}'
    cmds:
      - |
        bash -euo pipefail <<'BASH'
        : "${ENTERPRISE_VERSION:?Set ENTERPRISE_VERSION to a SemVer version without a v prefix}"
        : "${ENTERPRISE_REGISTRY:=registry.projectcapsule.dev}"
        : "${CHANNEL:=enterprise}"
        : "${DRY_RUN:=false}"
        if [[ ! "$ENTERPRISE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo 'ENTERPRISE_VERSION must be SemVer without a v prefix' >&2
          exit 1
        fi
        # OCI image tags cannot contain SemVer build metadata.
        if [[ "$ENTERPRISE_VERSION" == *+* ]]; then
          echo 'Build metadata is not supported in image tags; use a prerelease suffix' >&2
          exit 1
        fi
        case "$CHANNEL" in
          enterprise) chart_path=charts ;;
          prereleases) chart_path=charts/prereleases ;;
          *) echo 'Unknown release channel' >&2; exit 1 ;;
        esac
        image="$ENTERPRISE_REGISTRY/$CHANNEL/change-windows"
        chart="oci://$ENTERPRISE_REGISTRY/$chart_path"
        run() {
          if [[ "$DRY_RUN" == true ]]; then printf '%q ' "$@"; printf '\n'; else "$@"; fi
        }
        run env "IMG=$image:$ENTERPRISE_VERSION" task image:push
        run env "VERSION=$ENTERPRISE_VERSION" "CHART_REGISTRY=$chart" task helm:push
        printf '\nDeployment (requires cert-manager and a capsule-enterprise image pull secret):\n'
        printf 'helm upgrade --install scheduled-action %q --namespace capsule-system --create-namespace --version %q --set-string manager.image.reference=%q --set %q\n' \
          "$chart/change-windows" "$ENTERPRISE_VERSION" "$image:$ENTERPRISE_VERSION" 'serviceAccount.imagePullSecrets[0]=capsule-enterprise'
        BASH

  enterprise:prerelease:
    desc: Publish the prerelease image and chart (use DRY_RUN=true to preview).
    aliases: [enterprise-prerelease]
    cmds:
      - task: enterprise:release
        vars: {CHANNEL: prereleases}

  check:
    desc: Run the checks used by CI (e2e runs separately).
    cmds:
      - task: test:tooling
      - task: test
      - task: lint
      - task: lint:config
      - task: lint:files
      - task: lint:yaml
      - task: lint:actions
      - task: lint:shell
      - task: helm:lint
      - task: verify-generated
      - task: build
      - task: docs:check

  lint:yaml:format:
    desc: Check maintained YAML formatting.
    cmds:
      - yamlfmt -lint {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}.{{end}}

  lint:commit-message:
    desc: Validate a commit-message file supplied after --.
    cmds:
      - cog verify --ignore-merge-commits --file {{.CLI_ARGS}}
