name: Publish images with ko
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Scan release source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate release version
        id: version
        run: |
          : "${GITHUB_REF_NAME:?GITHUB_REF_NAME is required}"
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease' >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
      - name: Authenticate registry
        run: devbox run -- task registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish controller and SBOMs
        run: devbox run -- task image:push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository_owner }}/change-windows
      - name: Export immutable image reference
        id: image
        run: |
          : "${IMAGE_REFS:=dist/image-refs.txt}"
          ref=$(cat "$IMAGE_REFS")
          if [[ ! "$ref" =~ ^[^[:space:]@]+@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Expected one immutable published image reference' >&2
            exit 1
          fi
          image=${ref%@*}
          # ko includes the build tag before the digest; provenance needs the repository.
          if [[ "${image##*/}" == *:* ]]; then image=${image%:*}; fi
          printf 'image=%s\ndigest=%s\n' "$image" "${ref##*@}" >> "${GITHUB_OUTPUT:?GITHUB_OUTPUT is required}"
      - name: Sign published image
        run: devbox run -- task image:sign
  provenance:
    needs: publish-images
    permissions:
      id-token: write
      packages: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ${{ needs.publish-images.outputs.image }}
      digest: ${{ needs.publish-images.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
