name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: creekorful/goreportcard-action@1f35ced8cdac2cba28c9a2f2288a16aacfd507f9 # v1.0
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish release artifacts
        run: devbox run -- task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  headlamp-publish:
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: headlamp-plugin-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: projectcapsule/github-actions/headlamp-publish@84ff57abf7d51892eaf19efbbddefcfe56969071
        with:
          build-root: headlamp/
          target-branch: headlamp-plugin
          node-version: '24.21.0'
          metadata-template: artifacthub-pkg.yml
