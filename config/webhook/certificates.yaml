apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
spec:
  secretName: webhook-server-cert
  dnsNames:
    - schedule-action-controller-webhook-service.schedule-action-controller-system.svc
  issuerRef:
    name: schedule-action-controller-selfsigned-issuer
    kind: Issuer
