---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - addons.projectcapsule.dev
  resources:
  - changewindows
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - addons.projectcapsule.dev
  resources:
  - changewindows/finalizers
  verbs:
  - update
- apiGroups:
  - addons.projectcapsule.dev
  resources:
  - changewindows/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - userextras/addons.projectcapsule.dev/execution
  verbs:
  - impersonate
